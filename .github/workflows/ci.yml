name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# tests/test_skill.py runs the static checker, the credential detector, the
# workbook patcher and every runtime path against a loopback mock API, so it
# needs no network, no Tableau and no TabPy. A real TabPy run
# (`tests/test_skill.py --tabpy URL`) stays a manual step.
#
# Security note: this workflow reads only checked-in files. It does NOT
# interpolate PR titles, issue bodies, or any other untrusted input into
# shell commands.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.32.4" "pandas>=1.5" "simplejson>=3.17" "pyarrow>=14.0.1"

      - name: py_compile smoke - every .py in the repo parses
        run: python -m compileall -q scripts runtime tools tests examples

      - name: Runtime + scaffolds stay Python 3.8 syntax
        run: python -I scripts/check_script.py examples/nasa_neows/nasa_neows.py --py 3.8

      - name: Test suite (checker, detector, runtime, workbook patcher, docs freshness)
        run: python -I tests/test_skill.py
